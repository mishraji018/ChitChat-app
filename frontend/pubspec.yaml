name: blinkchat
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests (REST API calls)
  http: ^1.2.1

  # Socket.IO client (real-time messaging)
  socket_io_client: ^2.0.3+1

  # Local storage (save token, user data)
  shared_preferences: ^2.2.3

  # SMS Auto-fill for Android
  sms_autofill: ^2.4.0

  # State management and utilities
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  emoji_picker_flutter: ^2.2.0
  flutter_slidable: ^3.0.1
  intl: ^0.19.0
  timeago: ^3.6.1
  pinput: ^3.0.1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  flutter_local_notifications: ^17.1.2
  local_auth: ^2.1.8
  audioplayers: ^5.2.1
  flutter_ringtone_player: ^4.0.0
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
